<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>KOZA NIGHT WALK — コザ・サンシティ通り バーチャル飲み歩き</title>
<meta name="description" content="沖縄市コザのサンシティ通りを、OpenStreetMap の地図でバーチャル飲み歩き。API キー不要。">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="night mode-free view-aerial">

<div id="map" aria-label="地図"></div>
<div id="demo" hidden>
  <div class="demo-sign">KOZA<br>NIGHT WALK</div>
  <p>デモ表示：地図データを取得できませんでした。<br>この画面は位置関係を表していません。</p>
</div>

<header id="topbar">
  <h1 class="logo"><span>KOZA</span> NIGHT WALK</h1>
  <div class="modes" role="tablist" aria-label="モード切り替え">
    <button id="modeFree" role="tab" aria-selected="true">フリー</button>
    <button id="modeTour" role="tab" aria-selected="false">自動ツアー</button>
  </div>
  <div class="tools">
    <button id="btnList" title="店舗リスト">店舗</button>
    <button id="btn3D" title="3D 建物の表示切り替え" aria-pressed="true">3D</button>
    <button id="btnNight" title="夜景フィルター（演出）の切り替え" aria-pressed="true">夜景</button>
  </div>
</header>

<div id="status" hidden></div>

<div id="hud">
  <div id="caption"></div>
  <div id="where"></div>
</div>

<footer id="controls">
  <div class="free-only">
    <button id="btnWalk" class="neon">通りを歩く</button>
    <button id="btnBack" class="walk-only" aria-label="通りを戻る">◀ 戻る</button>
    <button id="btnFwd" class="walk-only neon" aria-label="通りを進む">進む ▶</button>
    <button id="btnSky" class="walk-only">上空へ</button>
  </div>
  <div class="tour-only">
    <button id="btnStart" class="neon">スタート</button>
    <button id="btnPause" hidden>一時停止</button>
    <button id="btnResume" hidden>再開</button>
    <button id="btnNext" class="neon" hidden>次へ</button>
    <button id="btnEnd" hidden>終了</button>
  </div>
  <div id="credit"></div>
</footer>

<aside id="panel" hidden aria-live="polite">
  <button class="close" id="panelClose" aria-label="閉じる">×</button>
  <div id="panelBody"></div>
</aside>

<aside id="list" hidden>
  <button class="close" id="listClose" aria-label="閉じる">×</button>
  <h2>店舗リスト</h2>
  <p class="fine" id="listNote"></p>
  <ol id="listBody"></ol>
  <div id="extraBox" hidden>
    <h3>地図に未登録の店舗（公開情報で確認）</h3>
    <ul id="extraBody"></ul>
  </div>
  <button id="btnReset" class="small">訪問記録をリセット</button>
  <button id="btnReload" class="small">店舗データを取り直す</button>
  <p class="fine">
    <b>実データ</b>：道路・建物・店舗（OpenStreetMap）<br>
    <b>演出</b>：カメラワーク、夜景フィルター、ネオン風 UI
  </p>
</aside>

<script src="vendor/maplibre-gl.js"></script>
<script src="js/data.js"></script>
<script src="js/geo.js"></script>
<script src="js/osm.js"></script>
<script src="js/map-maplibre.js"></script>
<script src="js/app.js"></script>
</body>
</html>
